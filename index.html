    <!-- Bắt tay TLS với Supabase ngay từ lúc parse HTML — RPC đầu tiên
         (phiên + dashboard) khỏi trả giá DNS+TLS. Vite thay %VITE_...%
         bằng giá trị build. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Typography Lotus Pearl: ĐÚNG HAI họ phông, nạp trong 1 request để
         bỏ waterfall + FOUC.
         · Be Vietnam Pro — phông VẬN HÀNH. Do người Việt thiết kế riêng cho
           tiếng Việt: dấu được vẽ và canh chuẩn ở cỡ nhỏ, có sẵn chữ số
           đều bề rộng (tabular). Dùng cho bảng, form, nhãn, nút, chat.
         · Cormorant Garamond — phông KỂ CHUYỆN. Chỉ logo, H1, section title
           lớn và số KPI hero. Serif nét thanh, sang và nữ tính ở cỡ lớn;
           đúng vì thế mà không được dùng cho chữ nhỏ có dấu.
         Đã bỏ Quicksand, Baloo 2 và Poppins — sau khi đổi vai trò phông thì
         không còn chỗ nào dùng, giữ lại chỉ tốn thêm ba request phông. -->
    <!-- v5 hiệu năng (16/08): TỰ HOST font (woff2 subset latin+vietnamese,
         chính là file Google phát) — bỏ hẳn hai origin fonts.googleapis/
         gstatic khỏi đường găng: không còn DNS+TLS+CSS chặn render ở lượt
         tải đầu, và font về cùng origin với trang. @font-face nội tuyến
         để không tốn thêm một request stylesheet. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="./fonts/BeVietnamPro-400-vietnamese.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
