# =====================================================================
#  Quality gate + Deploy (Lotus Pearl Atelier §GitHub Actions)
#  ---------------------------------------------------------------------
#  Cổng phát hành tinh gọn xác nhận typecheck, unit và các luồng E2E cốt lõi
#  trước khi cho phép build production và deploy.
#
#  Điểm sống còn: production-build KHÔNG được chạy nếu kiểm fail.
#  Các bước kiểm tra mở rộng vẫn có thể chạy riêng khi cần.
# =====================================================================
name: Quality and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact commit to quality-check without deploying Pages
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Chỉ các push main cùng chia sẻ hàng đợi phát hành. PR và dispatch chỉ
  # kiểm tra chất lượng nên dùng group riêng theo run, không chặn release.
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pages-main' || format('pages-non-deploy-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  TZ: Asia/Bangkok

jobs:
  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit || github.sha }}
          fetch-depth: 0

      - name: Require the dispatched exact commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci
      - name: Install bundled Chromium for unit contracts
        run: npx playwright install chromium --with-deps --no-shell
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run drift

  # GitHub không giữ credential DB production. Cổng này kiểm receipt PostgreSQL
  # 17 đã niêm phong và fail ngay khi migration/runner/test SQL bị thay đổi.
  source-access-db-contract:
    needs: static-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Verify sealed PostgreSQL 17 Source authorization evidence
        run: node scripts/verify-source-access-db-evidence.mjs

  e2e-mock:
    needs: static-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci

      - name: Install bundled full Chromium
        run: npx playwright install chromium --with-deps --no-shell

      # .env.local chỉ cần URL hợp lệ về mặt hình thức: E2E giả lập chặn
      # toàn bộ mạng ra ngoài và tự trả lời thay Supabase.
      - name: Tạo .env.local cho E2E giả lập
        run: |
          echo "VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL || 'https://gialap.supabase.co' }}" > .env.local
          echo "VITE_SUPABASE_ANON=${{ vars.VITE_SUPABASE_ANON || 'gialap-anon-key' }}" >> .env.local
          # with-preview.sh bắt buộc hai khoá này có mặt (mã thoát 3 nếu
          # thiếu). E2E giả lập không đăng nhập thật nên giá trị giả là đủ.
          echo "E2E_EMAIL=gialap@example.com" >> .env.local
          echo "E2E_PASSWORD=gialap-khong-dung-that" >> .env.local

      # Cổng tinh gọn giữ luồng giả lập, Source, danh mục và quyền quản trị.
      - name: E2E cốt lõi — luồng giả lập + Source + danh mục + quyền quản trị
        env:
          VITE_MANUAL_PLANNED_DEADLINES_ENABLED: true
        run: |
          bash scripts/with-preview.sh -- bash -c '
            npm run e2e:gialap &&
            npm run e2e:catalog &&
            npm run e2e:source-access &&
            npm run e2e:progress-rights &&
            npm run e2e:admin
          '

  a11y:
    needs: static-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci

      - name: Install bundled full Chromium
        run: npx playwright install chromium --with-deps --no-shell

      - name: Tạo .env.local cho accessibility giả lập
        run: |
          echo "VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL || 'https://gialap.supabase.co' }}" > .env.local
          echo "VITE_SUPABASE_ANON=${{ vars.VITE_SUPABASE_ANON || 'gialap-anon-key' }}" >> .env.local
          echo "E2E_EMAIL=gialap@example.com" >> .env.local
          echo "E2E_PASSWORD=gialap-khong-dung-that" >> .env.local

      - name: Accessibility — axe trên preview giả lập
        run: bash scripts/with-preview.sh -- npm run a11y

  production-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - static-quality
      - source-access-db-contract
      - e2e-mock
      - a11y
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ vars.VITE_SUPABASE_ANON }}
          VITE_VMP_READ_URL: ${{ vars.VITE_VMP_READ_URL }}
          VITE_N8N_WRITE_URL: ${{ vars.VITE_N8N_WRITE_URL }}
          VITE_N8N_AI_REPORT_URL: ${{ vars.VITE_N8N_AI_REPORT_URL }}
          VITE_N8N_CHAT_URL: ${{ vars.VITE_N8N_CHAT_URL }}
          VITE_N8N_CHAT_TOKEN: ${{ vars.VITE_N8N_CHAT_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
