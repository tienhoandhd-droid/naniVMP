# =====================================================================
#  Quality gate + Deploy (Lotus Pearl Atelier §GitHub Actions)
#  ---------------------------------------------------------------------
#  Trước đây workflow chỉ build rồi deploy — typecheck, unit, E2E giả lập,
#  shell và kiểm thẩm mỹ có sẵn trong repo nhưng KHÔNG chặn deploy.
#  Nghiên cứu 15/08 gọi đây là khoảng trống kỹ thuật quan trọng nhất.
#
#  Điểm sống còn: production-build KHÔNG được chạy nếu kiểm fail.
#  Chrome: runner ubuntu-latest có sẵn /usr/bin/google-chrome —
#  tests/e2e/chrome-path.mjs tự tìm thấy, không phải cài gì thêm.
#
#  --- Rà soát 19/08 (100 run gần nhất: 53 xanh / 26 đỏ / 20 bị huỷ) ----
#  Bốn nguyên nhân gốc đã đo được, và cách vá tương ứng ở dưới:
#
#  (1) 20/26 lần đỏ là bước "Visual regression". Đổi giao diện có chủ
#      đích là việc thường ngày, mà bước này nằm trong e2e-mock — job
#      chặn production-build — nên mỗi lần đổi UI là web đứng hẳn.
#      → Tách thành job "visual" RIÊNG, chạy song song, continue-on-error:
#        đỏ thì báo động + lưu ảnh chênh lệch, KHÔNG chặn deploy nữa.
#
#  (2) `npx playwright install --with-deps` gọi apt-get, và apt treo thật:
#      run 32216576794 đứng im 1h33m ở mirror Ubuntu, run 32169816409
#      (Visual baseline) treo 6 giờ đúng bước đó.
#      → Bỏ --with-deps (runner ubuntu-latest đã đủ thư viện), cache
#        ~/.cache/ms-playwright, và đặt timeout-minutes NGAY TRÊN BƯỚC
#        cài — hết giờ là đỏ nhanh, không treo tới hạn của cả job.
#
#  (3) 20 run bị huỷ khi còn xếp hàng vì cả run dùng chung group "pages"
#      với cancel-in-progress:false — push liên tiếp thì run đứng chờ bị
#      huỷ, commit đó không được kiểm dòng nào.
#      → Group của run đổi theo ref + cancel-in-progress:true (huỷ có chủ
#        đích bản cũ). Ràng buộc "một deploy tại một thời điểm" của Pages
#        chuyển xuống ĐÚNG job deploy.
#
#  (4) e2e-mock gọi with-preview.sh nhiều lần nên build lại nhiều lần.
#      → Gộp e2e + a11y vào MỘT lần gọi with-preview: một build thay vì hai.
# =====================================================================
name: Quality and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nguyên nhân (3): xếp hàng theo NHÁNH, không theo "pages". Run mới huỷ
# run cũ của cùng nhánh một cách có chủ đích — thay vì để run đang chờ bị
# huỷ ngẫu nhiên và commit trôi qua mà không hề được kiểm.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run drift

  e2e-mock:
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci

      # .env.local chỉ cần URL hợp lệ về mặt hình thức: E2E giả lập chặn
      # toàn bộ mạng ra ngoài và tự trả lời thay Supabase.
      - name: Tạo .env.local cho E2E giả lập
        run: |
          echo "VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL || 'https://gialap.supabase.co' }}" > .env.local
          echo "VITE_SUPABASE_ANON=${{ vars.VITE_SUPABASE_ANON || 'gialap-anon-key' }}" >> .env.local
          # with-preview.sh bắt buộc hai khoá này có mặt (mã thoát 3 nếu
          # thiếu). E2E giả lập không đăng nhập thật nên giá trị giả là đủ.
          echo "E2E_EMAIL=gialap@example.com" >> .env.local
          echo "E2E_PASSWORD=gialap-khong-dung-that" >> .env.local

      - name: Cache chromium của Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Nguyên nhân (2): KHÔNG dùng --with-deps. Cờ đó chạy apt-get, và apt
      # là thứ đã treo 1h33m / 6h. Runner ubuntu-latest đã sẵn thư viện hệ
      # thống cho chromium (chính nó cài sẵn google-chrome). timeout ở đây
      # là hạn của RIÊNG bước tải: treo thì đỏ trong 6 phút, không ngốn hết
      # 25 phút của job rồi mới chết.
      - name: Cài chromium cho Playwright (không đụng apt)
        timeout-minutes: 6
        run: npx playwright install chromium

      # KHÔNG thêm e2e:luongchinh / e2e:ux vào đây: hai bộ đó đăng nhập
      # Supabase THẬT bằng E2E_EMAIL/E2E_PASSWORD, mà CI chỉ có tài khoản
      # giả nên chúng luôn đỏ ở bước đăng nhập. Chạy chúng trên máy có
      # .env.local thật: npm run e2e:luongchinh · npm run e2e:ux
      #
      # Nguyên nhân (4): a11y nằm CHUNG lần gọi with-preview này. Mỗi lần
      # gọi with-preview.sh là một lần build lại từ đầu; gộp lại tiết kiệm
      # trọn một build mỗi run.
      - name: E2E giả lập + catalog + quyền admin + shell + thẩm mỹ + atelier + a11y
        run: |
          bash scripts/with-preview.sh -- bash -c '
            npm run e2e:gialap &&
            npm run e2e:catalog &&
            npm run e2e:admin &&
            npm run shell &&
            npm run thammy &&
            npm run atelier &&
            npm run a11y
          '

  # ---------------------------------------------------------------------
  #  visual — CẢNH BÁO, KHÔNG CHẶN (quyết định 19/08)
  #  ---------------------------------------------------------------------
  #  Job này cố tình KHÔNG nằm trong `needs` của production-build, và bật
  #  continue-on-error để run không bị nhuộm đỏ vì một thay đổi giao diện
  #  cố ý. Đỏ ở đây nghĩa là: "ảnh đã lệch so với baseline — vào xem diff
  #  rồi quyết", chứ không còn nghĩa là "cấm web cập nhật".
  #
  #  Đổi giao diện CÓ CHỦ ĐÍCH: chạy workflow "Visual baseline" để chụp
  #  lại ảnh chuẩn; nó tự gọi lại workflow này khi xong.
  # ---------------------------------------------------------------------
  visual:
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci

      - name: Tạo .env.local cho bộ ảnh
        run: |
          echo "VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL || 'https://gialap.supabase.co' }}" > .env.local
          echo "VITE_SUPABASE_ANON=${{ vars.VITE_SUPABASE_ANON || 'gialap-anon-key' }}" >> .env.local
          echo "E2E_EMAIL=gialap@example.com" >> .env.local
          echo "E2E_PASSWORD=gialap-khong-dung-that" >> .env.local

      - name: Cache chromium của Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cài chromium cho Playwright (không đụng apt)
        timeout-minutes: 6
        run: npx playwright install chromium

      # Visual regression chỉ so được khi ĐÃ có baseline sinh từ chính môi
      # trường CI (workflow "Visual baseline" tạo ra). Chưa có thì bỏ qua
      # có thông báo — không giả vờ ĐẠT.
      - name: Visual regression (so với baseline CI)
        id: visual
        run: |
          if [ -d tests/visual/baselines/chromium-linux ]; then
            bash scripts/with-preview.sh -- npm run visual
          else
            echo "BỎ QUA: chưa có baseline linux — chạy workflow 'Visual baseline' để tạo."
          fi

      - name: Ghi cảnh báo lên bản tóm tắt run
        if: failure()
        run: |
          {
            echo "## ⚠️ Ảnh giao diện đã lệch so với baseline"
            echo
            echo "Job này **không chặn deploy** — web vẫn lên bản mới."
            echo
            echo "- Nếu lệch là **có chủ đích**: chạy workflow **Visual baseline** để chụp lại ảnh chuẩn."
            echo "- Nếu lệch là **ngoài ý muốn**: tải artifact \`visual-diff\` ở dưới để xem ảnh chênh lệch, rồi sửa."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lưu ảnh chênh lệch khi visual fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/
          if-no-files-found: ignore

  production-build:
    if: github.event_name != 'pull_request'
    # Cố ý KHÔNG có `visual` ở đây — xem ghi chú của job visual.
    needs:
      - static-quality
      - e2e-mock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ vars.VITE_SUPABASE_ANON }}
          VITE_VMP_READ_URL: ${{ vars.VITE_VMP_READ_URL }}
          VITE_N8N_WRITE_URL: ${{ vars.VITE_N8N_WRITE_URL }}
          VITE_N8N_AI_REPORT_URL: ${{ vars.VITE_N8N_AI_REPORT_URL }}
          VITE_N8N_CHAT_URL: ${{ vars.VITE_N8N_CHAT_URL }}
          VITE_N8N_CHAT_TOKEN: ${{ vars.VITE_N8N_CHAT_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: production-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ràng buộc của GitHub Pages — chỉ một deploy tại một thời điểm — nằm
    # ĐÚNG ở đây, chứ không ở cấp run. Nhờ vậy các job kiểm không còn phải
    # xếp hàng sau một deploy đang chạy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
