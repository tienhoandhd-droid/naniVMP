# =====================================================================
#  Quality gate + Deploy (Lotus Pearl Atelier §GitHub Actions)
#  ---------------------------------------------------------------------
#  Trước đây workflow chỉ build rồi deploy — typecheck, unit, E2E giả lập,
#  shell và kiểm thẩm mỹ có sẵn trong repo nhưng KHÔNG chặn deploy.
#  Nghiên cứu 15/08 gọi đây là khoảng trống kỹ thuật quan trọng nhất.
#
#  Điểm sống còn: production-build KHÔNG được chạy nếu kiểm fail.
#  Chrome: runner ubuntu-latest có sẵn /usr/bin/google-chrome —
#  tests/e2e/chrome-path.mjs tự tìm thấy, không phải cài gì thêm.
# =====================================================================
name: Quality and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run drift

  e2e-mock:
    needs: static-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci

      # .env.local chỉ cần URL hợp lệ về mặt hình thức: E2E giả lập chặn
      # toàn bộ mạng ra ngoài và tự trả lời thay Supabase.
      - name: Tạo .env.local cho E2E giả lập
        run: |
          echo "VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL || 'https://gialap.supabase.co' }}" > .env.local
          echo "VITE_SUPABASE_ANON=${{ vars.VITE_SUPABASE_ANON || 'gialap-anon-key' }}" >> .env.local
          # with-preview.sh bắt buộc hai khoá này có mặt (mã thoát 3 nếu
          # thiếu). E2E giả lập không đăng nhập thật nên giá trị giả là đủ.
          echo "E2E_EMAIL=gialap@example.com" >> .env.local
          echo "E2E_PASSWORD=gialap-khong-dung-that" >> .env.local

      - name: E2E giả lập + catalog + quyền admin + luồng chính + UX + shell + thẩm mỹ + atelier
        run: |
          bash scripts/with-preview.sh -- bash -c '
            npm run e2e:gialap &&
            npm run e2e:catalog &&
            npm run e2e:admin &&
            npm run e2e:luongchinh &&
            npm run e2e:ux &&
            npm run shell &&
            npm run thammy &&
            npm run atelier
          '

      # Cổng accessibility (nghiên cứu (3) đợt 3): axe quét 5 màn chính,
      # 0 vi phạm critical/serious mới qua. Mức nhẹ hơn in ra để trả dần.
      - name: Accessibility (axe — 0 critical/serious)
        run: |
          npx playwright install chromium --with-deps
          bash scripts/with-preview.sh -- npm run a11y

      # Visual regression chỉ so được khi ĐÃ có baseline sinh từ chính môi
      # trường CI (workflow "Visual baseline" tạo ra). Chưa có thì bỏ qua
      # có thông báo — không giả vờ ĐẠT.
      - name: Visual regression (so với baseline CI)
        run: |
          if [ -d tests/visual/baselines/chromium-linux ]; then
            bash scripts/with-preview.sh -- npm run visual
          else
            echo "BỎ QUA: chưa có baseline linux — chạy workflow 'Visual baseline' để tạo."
          fi

      - name: Lưu ảnh chênh lệch khi visual fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/
          if-no-files-found: ignore

  production-build:
    if: github.event_name != 'pull_request'
    needs:
      - static-quality
      - e2e-mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ vars.VITE_SUPABASE_ANON }}
          VITE_VMP_READ_URL: ${{ vars.VITE_VMP_READ_URL }}
          VITE_N8N_WRITE_URL: ${{ vars.VITE_N8N_WRITE_URL }}
          VITE_N8N_AI_REPORT_URL: ${{ vars.VITE_N8N_AI_REPORT_URL }}
          VITE_N8N_CHAT_URL: ${{ vars.VITE_N8N_CHAT_URL }}
          VITE_N8N_CHAT_TOKEN: ${{ vars.VITE_N8N_CHAT_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: production-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
