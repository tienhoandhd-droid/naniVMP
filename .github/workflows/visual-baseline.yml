# =====================================================================
#  visual-baseline.yml — cập nhật baseline visual regression TRÊN CI
#  ---------------------------------------------------------------------
#  Chạy tay (workflow_dispatch) khi giao diện đổi CÓ CHỦ ĐÍCH. Ảnh chuẩn
#  phải sinh từ đúng môi trường sẽ so (ubuntu + chromium của Playwright);
#  ảnh chụp trên máy dev macOS lệch font rendering nên bị gitignore.
#  Workflow tự commit baseline mới với [skip ci].
# =====================================================================
name: Visual baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cài chromium cho Playwright
        run: npx playwright install chromium --with-deps

      - name: Dựng .env.local giả lập (không secret thật)
        run: |
          echo "VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON=${{ vars.VITE_SUPABASE_ANON }}" >> .env.local
          echo "E2E_EMAIL=gialap@example.com" >> .env.local
          echo "E2E_PASSWORD=gialap-khong-dung-that" >> .env.local

      - name: Chụp lại toàn bộ baseline
        run: bash scripts/with-preview.sh -- npx playwright test -c playwright.visual.config.ts --update-snapshots

      - name: Commit baseline mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/baselines
          if git diff --cached --quiet; then
            echo "Baseline không đổi — không có gì để commit."
          else
            git commit -m "test(visual): cập nhật baseline từ CI [skip ci]"
            git push
          fi
