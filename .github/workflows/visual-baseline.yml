name: Visual baseline

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact feature-branch commit to generate and seal
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  update-baseline:
    runs-on: ubuntu-24.04
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse main and require the dispatched branch's exact commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF_TYPE" = branch
          test -n "$DISPATCH_BRANCH"
          test "$DISPATCH_BRANCH" != main
          case "$EXPECTED_COMMIT" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "expected_commit must be a lowercase 40-character commit SHA" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git merge-base --is-ancestor "$EXPECTED_COMMIT" "origin/$DISPATCH_BRANCH"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install bundled full Chromium
        run: npx playwright install chromium --with-deps --no-shell

      - name: Verify pinned visual runtime
        run: npm run visual:runtime

      - name: Create mock environment
        run: |
          set -euo pipefail
          cat > .env.local <<'EOF'
          VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL || 'https://gialap.supabase.co' }}
          VITE_SUPABASE_ANON=${{ vars.VITE_SUPABASE_ANON || 'gialap-anon-key' }}
          E2E_EMAIL=gialap@example.com
          E2E_PASSWORD=gialap-khong-dung-that
          EOF

      - name: Update all Linux visual snapshots
        run: bash scripts/with-preview.sh -- npm run visual:capnhat

      - name: Seal the exact baseline tree
        run: npm run visual:baseline:seal

      - name: Verify the sealed baseline tree
        run: npm run visual:contract

      - name: Compare the sealed visual matrix
        run: |
          set -euo pipefail
          bash scripts/with-preview.sh -- npm run visual 2>&1 | tee visual-output.log
          npm run --silent visual:matrix:verify -- visual-output.log

      - name: Stage and validate the complete matrix plus the seal
        run: |
          set -euo pipefail
          expected_count="$(npm run --silent visual:matrix:count)"
          git add tests/visual/baselines tests/visual/baseline-contract.env
          test -z "$(git diff --cached --name-only --diff-filter=DR)"
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq "$((expected_count + 1))"
          png_count=0
          for file in "${changed[@]}"; do
            if [ "$file" = tests/visual/baseline-contract.env ]; then
              continue
            fi
            case "$file" in
              tests/visual/baselines/*-linux/*.png) png_count=$((png_count + 1)) ;;
              *) echo "unexpected generated path: $file" >&2; exit 1 ;;
            esac
          done
          test "$png_count" -eq "$expected_count"
          test "$(find tests/visual/baselines -type f -path '*-linux/*.png' -name '*.png' | wc -l | tr -d ' ')" -eq "$expected_count"
          git diff --cached --check

      - name: Commit and push generated baseline artifacts
        env:
          DISPATCH_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): cập nhật baseline từ CI"
          generated_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$DISPATCH_BRANCH"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -f "ref=$DISPATCH_BRANCH" \
            -f "inputs[expected_commit]=$generated_commit"
          echo "CONTROLLER_MONITOR_SHA=$generated_commit"
