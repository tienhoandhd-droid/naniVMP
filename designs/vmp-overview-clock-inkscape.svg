<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <title>VMP Overview — Đồng hồ năm hoa sen</title>
  <desc>Bản tham khảo vector cho Vòng năm 2026 với 12 tháng cố định, kim hôm nay và báo cáo tiến độ.</desc>
  <defs>
    <filter id="cardShadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3f263f" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6edf1"/>
      <stop offset="1" stop-color="#efe3ea"/>
    </linearGradient>
    <radialGradient id="dialPearl" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbf7f4"/>
    </radialGradient>
    <path id="lotusPetal" d="M 0,-132 C -56,-184 -58,-245 0,-292 C 58,-245 56,-184 0,-132 Z"/>
    <style>
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .ink { fill: #3f263f; }
      .muted { fill: #756575; }
      .month { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #3f263f; text-anchor: middle; }
      .count { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #756575; text-anchor: middle; }
      .metric-label { font: 650 18px "Segoe UI", Arial, sans-serif; fill: #625262; }
      .metric-number { font: 750 27px "Segoe UI", Arial, sans-serif; text-anchor: end; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#f7f1f3"/>
  <rect x="34" y="30" width="1532" height="760" rx="34" fill="#fffdfc" stroke="#d6bd9d" stroke-opacity="0.65" filter="url(#cardShadow)"/>

  <!-- Insight ribbon -->
  <rect x="76" y="70" width="1448" height="122" rx="24" fill="url(#banner)"/>
  <path d="M 76,94 Q 76,70 100,70 H 164 V 192 H 100 Q 76,192 76,168 Z" fill="#fff9f6"/>
  <line x1="164" y1="70" x2="164" y2="192" stroke="#c69a42" stroke-width="2"/>
  <g transform="translate(120 131)" fill="none" stroke="#c69a42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle r="27"/>
    <path d="M0 18 C-2 4 -12 -2 -18 -13 C-4 -12 2 -7 0 5 C2 -7 8 -12 18 -13 C12 -2 2 4 0 18 M0 4 C-10 4 -16 -1 -20 -8 M0 4 C10 4 16 -1 20 -8"/>
  </g>
  <text x="202" y="119" class="sans ink" font-size="24" font-weight="750">7 tháng đã qua gánh 4 hạng mục và mới xong 0 (0%). Còn 24 hạng mục phải xong trong 5 tháng cuối.</text>
  <text x="202" y="158" class="sans muted" font-size="18" font-weight="550">Tức là 5 hạng mục/tháng, ngang nhịp đang đi. Tháng 8 nặng nhất với 11 hạng mục.</text>

  <!-- Decorative lotus halo: identical petals, never data-bearing -->
  <g transform="translate(400 500)" fill="#f3e7ed" fill-opacity="0.32" stroke="#c69a42" stroke-opacity="0.30" stroke-width="1.7">
    <use href="#lotusPetal" transform="rotate(0)"/>
    <use href="#lotusPetal" transform="rotate(30)"/>
    <use href="#lotusPetal" transform="rotate(60)"/>
    <use href="#lotusPetal" transform="rotate(90)"/>
    <use href="#lotusPetal" transform="rotate(120)"/>
    <use href="#lotusPetal" transform="rotate(150)"/>
    <use href="#lotusPetal" transform="rotate(180)"/>
    <use href="#lotusPetal" transform="rotate(210)"/>
    <use href="#lotusPetal" transform="rotate(240)"/>
    <use href="#lotusPetal" transform="rotate(270)"/>
    <use href="#lotusPetal" transform="rotate(300)"/>
    <use href="#lotusPetal" transform="rotate(330)"/>
  </g>

  <!-- Month ring: fixed equal sectors; color alone is backed by labels/legend -->
  <circle cx="400" cy="500" r="171" fill="url(#dialPearl)" stroke="#eadfe4" stroke-width="2"/>
  <g fill="none" stroke-width="14" stroke-linecap="round">
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#ad3e61" stroke-dasharray="86 1114" transform="rotate(-90 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#ad3e61" stroke-dasharray="86 1114" transform="rotate(-60 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#ad3e61" stroke-dasharray="86 1114" transform="rotate(-30 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#ad3e61" stroke-dasharray="86 1114" transform="rotate(0 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#ad3e61" stroke-dasharray="86 1114" transform="rotate(30 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#ad3e61" stroke-dasharray="86 1114" transform="rotate(60 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#ad3e61" stroke-dasharray="86 1114" transform="rotate(90 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#c69a42" stroke-dasharray="86 1114" transform="rotate(120 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#8da8ba" stroke-dasharray="86 1114" transform="rotate(150 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#8da8ba" stroke-dasharray="86 1114" transform="rotate(180 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#8da8ba" stroke-dasharray="86 1114" transform="rotate(210 400 500)"/>
    <circle cx="400" cy="500" r="160" pathLength="1200" stroke="#8da8ba" stroke-dasharray="86 1114" transform="rotate(240 400 500)"/>
  </g>

  <!-- Month labels and exact visible counts -->
  <g>
    <text x="457" y="273" class="month">T1<tspan x="457" dy="21" class="count">2</tspan></text>
    <text x="556" y="329" class="month">T2<tspan x="556" dy="21" class="count">0</tspan></text>
    <text x="613" y="428" class="month">T3<tspan x="613" dy="21" class="count">0</tspan></text>
    <text x="613" y="542" class="month">T4<tspan x="613" dy="21" class="count">0</tspan></text>
    <text x="556" y="641" class="month">T5<tspan x="556" dy="21" class="count">0</tspan></text>
    <text x="457" y="697" class="month">T6<tspan x="457" dy="21" class="count">0</tspan></text>
    <text x="343" y="697" class="month">T7<tspan x="343" dy="21" class="count">4</tspan></text>
    <text x="244" y="641" class="month" fill="#a87522">T8<tspan x="244" dy="21" class="count" fill="#a87522">11</tspan></text>
    <text x="187" y="542" class="month">T9<tspan x="187" dy="21" class="count">2</tspan></text>
    <text x="187" y="428" class="month">T10<tspan x="187" dy="21" class="count">2</tspan></text>
    <text x="244" y="329" class="month">T11<tspan x="244" dy="21" class="count">2</tspan></text>
    <text x="343" y="273" class="month">T12<tspan x="343" dy="21" class="count">1</tspan></text>
  </g>

  <!-- Today hand -->
  <line x1="400" y1="500" x2="289" y2="611" stroke="#c69a42" stroke-width="5" stroke-linecap="round"/>
  <circle cx="289" cy="611" r="10" fill="#fffdfc" stroke="#c69a42" stroke-width="5"/>
  <circle cx="400" cy="500" r="5" fill="#c69a42"/>

  <!-- Center -->
  <text x="400" y="493" text-anchor="middle" class="serif ink" font-size="64">0%</text>
  <text x="400" y="533" text-anchor="middle" class="sans ink" font-size="17" font-weight="750" letter-spacing="3">HOÀN THÀNH VMP</text>
  <text x="400" y="562" text-anchor="middle" class="sans muted" font-size="16" font-weight="600">trên 24 hạng mục</text>

  <!-- Right summary -->
  <g transform="translate(770 252)">
    <text x="0" y="30" class="sans ink" font-size="31" font-weight="760">Tiến độ thẩm định 2026</text>
    <text x="0" y="65" class="sans muted" font-size="17">24 hạng mục trong kế hoạch năm</text>

    <g transform="translate(0 130)">
      <circle cx="12" cy="0" r="7" fill="#2f7a63"/>
      <text x="35" y="7" class="metric-label">Hoàn thành</text>
      <rect x="455" y="-7" width="240" height="10" rx="5" fill="#eadfe4"/>
      <text x="752" y="8" class="metric-number" fill="#2f7a63">0</text>
    </g>
    <g transform="translate(0 199)">
      <circle cx="12" cy="0" r="7" fill="#ad3e61"/>
      <text x="35" y="7" class="metric-label">Quá hạn</text>
      <rect x="455" y="-7" width="240" height="10" rx="5" fill="#eadfe4"/>
      <rect x="455" y="-7" width="150" height="10" rx="5" fill="#ad3e61"/>
      <text x="752" y="8" class="metric-number" fill="#ad3e61">15</text>
    </g>
    <g transform="translate(0 268)">
      <circle cx="12" cy="0" r="7" fill="#a66b18"/>
      <text x="35" y="7" class="metric-label">Chưa hoàn thành</text>
      <rect x="455" y="-7" width="240" height="10" rx="5" fill="#eadfe4"/>
      <rect x="455" y="-7" width="90" height="10" rx="5" fill="#a66b18"/>
      <text x="752" y="8" class="metric-number" fill="#a66b18">9</text>
    </g>

    <line x1="0" y1="322" x2="752" y2="322" stroke="#ded0d7"/>
    <text x="0" y="365" class="sans ink" font-size="17" font-weight="650">Hồ sơ hoàn thiện: 0% (0/24)</text>

    <g transform="translate(0 412)" class="sans" font-size="15" font-weight="600" fill="#625262">
      <circle cx="8" cy="-5" r="6" fill="#2f7a63"/><text x="23" y="0">Đã xong</text>
      <circle cx="118" cy="-5" r="6" fill="#ad3e61"/><text x="133" y="0">Đã tới hạn, chưa xong</text>
      <circle cx="344" cy="-5" r="6" fill="#8da8ba"/><text x="359" y="0">Chưa tới hạn</text>
      <line x1="500" y1="-15" x2="500" y2="5" stroke="#c69a42" stroke-width="3"/><text x="514" y="0">Hôm nay</text>
    </g>

    <g transform="translate(0 458)">
      <rect width="270" height="52" rx="26" fill="#fffdfc" stroke="#b89cae" stroke-width="1.4"/>
      <text x="24" y="33" class="sans ink" font-size="16" font-weight="700">Xem bảng số 12 tháng</text>
      <path d="M235 19 L247 26 L235 33" fill="none" stroke="#3f263f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
