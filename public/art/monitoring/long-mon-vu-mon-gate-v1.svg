<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1120" width="540" height="1120">
  <!-- =================================================================
       Vũ Môn — cổng Long Môn, lớp phủ mép phải của Ngư đồ.
       Truyền thuyết: cá chép vượt Vũ Môn hoá rồng. Trên trường đua hạn
       VMP, mép phải là đích thời gian — nên cái cổng phải THẬT, không
       chỉ là vệt sáng. Vẽ tay bằng SVG, kiểm và xuất qua Inkscape.
       Bảng màu ăn theo tranh nền màu nước: mực chàm #18342f, sương
       #dfe9e2, giấy kem #f2ead3, vàng kim #d9b45b.
       ================================================================= -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6ecd2" stop-opacity="0"/>
      <stop offset=".62" stop-color="#f2e3bd" stop-opacity=".38"/>
      <stop offset="1" stop-color="#efd9a4" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf0" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#e9f0e7" stop-opacity=".5"/>
      <stop offset="1" stop-color="#dfe9e2" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c3a34"/>
      <stop offset=".5" stop-color="#2c4f46"/>
      <stop offset="1" stop-color="#16302b"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#f8eecd" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#f2e3bd" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f2e3bd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="mist" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Quầng sáng đích — kéo mắt về cổng, nơi mọi con cá đang bơi tới -->
  <rect x="60" y="0" width="480" height="1120" fill="url(#glow)"/>
  <ellipse cx="392" cy="470" rx="300" ry="330" fill="url(#halo)"/>

  <!-- Rồng ẩn trong sương phía trên cổng: lời hứa của việc VƯỢT —
       cực nhạt (12%), chỉ hiện ra khi nhìn lâu -->
  <g opacity=".13" filter="url(#mist)">
    <path d="M180 118 C255 62 356 84 400 132 C452 188 420 242 476 252 C430 282 372 262 344 214 C318 168 262 148 216 176 C186 194 168 160 180 118 Z"
      fill="none" stroke="#274a42" stroke-width="17" stroke-linecap="round"/>
    <path d="M395 128 c16 -13 40 -12 52 4 c-14 10 -20 8 -30 22 c-10 -8 -18 -14 -22 -26 Z" fill="#274a42"/>
    <circle cx="428" cy="142" r="5.5" fill="#d9b45b"/>
    <path d="M188 128 c-16 4 -30 -2 -38 -14 m52 44 c-18 8 -36 6 -48 -4" stroke="#274a42" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Thác bạc đổ qua cổng — ba dải lụa lệch pha -->
  <g>
    <path d="M382 96 C368 300 388 520 366 760 C356 866 372 986 362 1090 L418 1090 C430 964 414 852 428 736 C444 522 424 300 436 96 Z"
      fill="url(#fall)" filter="url(#soft)"/>
    <path d="M420 120 C412 320 432 560 414 800 C408 902 420 1000 412 1090 L446 1090 C456 986 446 894 456 788 C468 556 452 320 462 120 Z"
      fill="url(#fall)" opacity=".7"/>
    <path d="M352 150 C344 340 358 560 344 780 C338 884 348 1004 342 1090 L368 1090 C376 990 368 880 378 762 C390 552 376 342 386 150 Z"
      fill="url(#fall)" opacity=".45"/>
  </g>

  <!-- Cổng đá hai trụ, mái cong kiểu cổng đá Á Đông -->
  <g>
    <!-- mái -->
    <path d="M236 236 C300 190 462 190 524 236 L536 214 C548 196 540 184 524 190 L512 196 C450 152 310 152 250 196 L238 190 C222 184 214 196 226 214 Z"
      fill="url(#pillar)"/>
    <path d="M250 196 C310 152 450 152 512 196 L506 214 C450 176 312 176 256 214 Z" fill="#d9b45b" opacity=".5"/>
    <!-- xà ngang -->
    <rect x="256" y="238" width="250" height="26" rx="9" fill="url(#pillar)"/>
    <rect x="256" y="243" width="250" height="4" fill="#d9b45b" opacity=".55"/>
    <!-- biển "門" cách điệu: khung ấn vàng giữa xà -->
    <rect x="358" y="212" width="48" height="58" rx="7" fill="#22423a"/>
    <rect x="362" y="216" width="40" height="50" rx="5" fill="none" stroke="#d9b45b" stroke-width="2.5" opacity=".85"/>
    <path d="M370 226 v30 m24 -30 v30 m-24 -22 h24 m-24 12 h24" stroke="#e8cf92" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- trụ trái -->
    <rect x="268" y="262" width="34" height="828" rx="8" fill="url(#pillar)"/>
    <rect x="272" y="262" width="6" height="828" fill="#d9b45b" opacity=".22"/>
    <!-- trụ phải -->
    <rect x="470" y="262" width="34" height="828" rx="8" fill="url(#pillar)"/>
    <rect x="474" y="262" width="6" height="828" fill="#d9b45b" opacity=".22"/>
    <!-- chân đá -->
    <path d="M252 1058 h66 l-8 -30 h-50 Z M454 1058 h66 l-8 -30 h-50 Z" fill="#16302b"/>
  </g>

  <!-- Bọt nước chân thác + vảy vàng -->
  <g opacity=".8">
    <ellipse cx="392" cy="1072" rx="150" ry="26" fill="#eef4ec" opacity=".5" filter="url(#soft)"/>
    <g fill="#fdfaf0">
      <circle cx="330" cy="1046" r="5"/><circle cx="366" cy="1060" r="7"/><circle cx="410" cy="1050" r="4.5"/>
      <circle cx="446" cy="1063" r="6"/><circle cx="478" cy="1046" r="4"/><circle cx="300" cy="1066" r="4"/>
    </g>
    <g fill="#d9b45b" opacity=".85">
      <circle cx="348" cy="1030" r="2.6"/><circle cx="392" cy="1018" r="2.2"/><circle cx="430" cy="1034" r="2.8"/>
      <circle cx="322" cy="990" r="1.9"/><circle cx="458" cy="1002" r="2.1"/><circle cx="402" cy="962" r="1.8"/>
      <circle cx="372" cy="930" r="1.6"/><circle cx="440" cy="898" r="1.5"/>
    </g>
  </g>

  <!-- Sóng thuỷ ba cách điệu ở chân cổng — nhịp truyền thống -->
  <g stroke="#dfe9e2" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round">
    <path d="M240 1084 q26 -20 52 0 q26 -20 52 0"/>
    <path d="M356 1096 q26 -20 52 0 q26 -20 52 0"/>
    <path d="M468 1082 q24 -18 48 0"/>
  </g>
</svg>
